services:
  pvp:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "${DUEL_BIND_ADDRESS:-127.0.0.1}:${DUEL_PORT:-4173}:4173"
    environment:
      DUEL_HOST: 0.0.0.0
      DUEL_PORT: 4173
      DUEL_MAX_ROOMS: ${DUEL_MAX_ROOMS:-100}
      DUEL_DATA_DIR: /data
      DUEL_TRUST_PROXY: ${DUEL_TRUST_PROXY:-0}
      DUEL_ORIGINS: ${DUEL_ORIGINS:-}
      DUEL_AI_UPSTREAMS: ${DUEL_AI_UPSTREAMS:-}
      DUEL_AI_DEFAULT_KEY: ${DUEL_AI_DEFAULT_KEY:-}
      DUEL_AI_DEFAULT_URL: ${DUEL_AI_DEFAULT_URL:-}
      DUEL_AI_DEFAULT_MODEL: ${DUEL_AI_DEFAULT_MODEL:-}
      DUEL_AI_DEFAULT_PROTOCOL: ${DUEL_AI_DEFAULT_PROTOCOL:-openai}
      DUEL_AI_DEFAULT_ENDPOINT: ${DUEL_AI_DEFAULT_ENDPOINT:-responses}
      DUEL_AI_HOURLY_LIMIT: ${DUEL_AI_HOURLY_LIMIT:-30}
    volumes:
      - pvp-data:/data
    stop_grace_period: 15s
  caddy:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DUEL_DOMAIN: ${DUEL_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      pvp:
        condition: service_healthy
volumes:
  pvp-data:
  caddy-data:
  caddy-config:
